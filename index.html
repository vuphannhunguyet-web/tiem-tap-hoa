<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tiệm Tạp Hóa Nhỏ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <header>
            <div>
                <h1>🏪 Tiệm Tạp Hóa Nhỏ</h1>
                <p>Quản lý cửa hàng của bạn</p>
            </div>

            <div class="status">
                <div>💰 <span id="money">2.000.000đ</span></div>
                <div>🌤️ Ngày <span id="day">1</span></div>
            </div>
        </header>


        <main>

            <!-- KHU VỰC CỬA HÀNG -->
            <section class="store">

                <h2>🛍️ Cửa hàng</h2>

                <div class="shelf-box">

                    <div class="shelf">
                        <div class="product">🥤</div>
                        <div>
                            <strong>Nước ngọt</strong>
                            <p>Trên kệ: <span id="shelf">0</span>/20</p>
                        </div>
                    </div>

                </div>

                <button onclick="customerBuy()">
                    🛒 Khách mua hàng
                </button>

            </section>


            <!-- KHO -->
            <section class="warehouse">

                <h2>📦 Kho hàng</h2>

                <div class="warehouse-item">
                    <div class="big-icon">🥤</div>

                    <div>
                        <strong>Nước ngọt</strong>
                        <p>
                            Trong kho:
                            <span id="warehouse">0</span>
                        </p>
                    </div>
                </div>

                <button onclick="buyProduct()">
                    📦 Nhập 10 chai
                </button>

                <button onclick="putOnShelf()">
                    🗄️ Đưa lên kệ
                </button>

            </section>


            <!-- ĐƠN ONLINE -->
            <section class="online">

                <h2>📱 Đơn hàng online</h2>

                <div class="order">

                    <div class="customer-avatar">
                        📱
                    </div>

                    <div>
                        <strong>Đơn hàng mới</strong>
                        <p>2 chai nước ngọt</p>
                    </div>

                </div>

                <button onclick="onlineOrder()">
                    📦 Đóng gói & giao hàng
                </button>

            </section>


            <!-- NHẬT KÝ -->
            <section class="log-box">

                <h2>💬 Nhật ký cửa hàng</h2>

                <div id="log"></div>

            </section>

        </main>


        <footer>

            <button class="end-day" onclick="endDay()">
                🌙 Kết thúc ngày
            </button>

        </footer>

    </div>


    <script src="game.js"></script>

</body>
</html>
